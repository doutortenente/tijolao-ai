# Config estática do Traefik — lida uma vez na subida.
# Sem HTTPS: dentro da tailnet o tráfego já viaja cifrado pelo WireGuard
# (mesmo raciocínio do painel do Hermes na porta 9119).
# Certificado Let's Encrypt para *.ts.net não é possível sem o Funnel
# funcionando (pendência conhecida da conta Tailscale).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy

api:
  dashboard: true

log:
  level: INFO
